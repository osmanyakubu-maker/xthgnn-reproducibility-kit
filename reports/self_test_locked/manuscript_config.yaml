    - 0.2
    - 0.3
    - 0.377
    - 0.4
    - 0.5
    perturbation_noise: 0.02
    stability_repeats: 2
    latency_warmup: 1
    latency_repeats: 2
  evaluation:
    closed_window_seconds: 500
    unit: node-window, event edge, and binary evaluation subgraph/window
  robustness:
    budgets:
    - 0.05
    - 0.1
    feature_epsilon: 0.01
    training_edge_budget: 0.05
